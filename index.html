<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Barco</title>
<style>
  :root {
    --coffee-dark: #2c1810;
    --coffee: #4a2c1a;
    --cream: #faf3e8;
    --accent: #c17a3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--coffee-dark);
    background: linear-gradient(160deg, var(--coffee-dark), var(--coffee));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--cream);
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 2.25rem;
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
  p.subtitle {
    margin: 0 0 40px;
    opacity: 0.8;
    font-size: 1rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.button {
    display: block;
    padding: 18px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid rgba(250, 243, 232, 0.15);
  }
  a.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  }
  a.primary {
    background: var(--accent);
    color: var(--coffee-dark);
  }
  a.secondary {
    background: rgba(250, 243, 232, 0.08);
    color: var(--cream);
  }
  .desc {
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
    opacity: 0.75;
    margin-top: 4px;
  }
  footer {
    margin-top: 48px;
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Cafe Barco</h1>
    <p class="subtitle">Table bookings, made simple.</p>
    <div class="links">
      <a class="button primary" href="booking-widget.html">
        Book a Table
        <span class="desc">Reserve your spot at Cafe Barco</span>
      </a>
      <a class="button secondary" href="dashboard.html">
        Staff Dashboard
        <span class="desc">Manage bookings and view schedule</span>
      </a>
    </div>
    <footer>Cafe Barco</footer>
  </div>
</body>
</html>
